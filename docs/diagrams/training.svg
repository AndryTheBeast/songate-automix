<svg xmlns='http://www.w3.org/2000/svg' width='780' height='300' viewBox='0 0 780 300' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='780' height='300' rx='18' fill='#171a22'/>
<text x='28' y='38' font-size='19' font-weight='700' fill='#eef0f6'>Training a model</text>
<text x='28' y='62' font-size='12.5' fill='#a7adbd'>Rounds of 24 blind demos from a real library, rated 0 to 10, until each kind of join has settled.</text>
<rect x='28' y='92' width='168' height='104' rx='12' fill='#0f1117' stroke='#8fb3ff' stroke-opacity='0.55'/>
<text x='42' y='116' font-size='14' font-weight='700' fill='#eef0f6'>mixtrain round</text>
<text x='42' y='136' font-size='11.5' fill='#a7adbd'>picks joins of each kind</text>
<text x='42' y='153' font-size='11.5' fill='#a7adbd'>from the library's folders,</text>
<text x='42' y='170' font-size='11.5' fill='#a7adbd'>renders 3 versions each</text>
<line x1='196' y1='144' x2='212' y2='144' stroke='#6c7386' stroke-width='1.6'/>
<line x1='212' y1='144' x2='204.8' y2='147.5' stroke='#6c7386' stroke-width='1.6'/>
<line x1='212' y1='144' x2='204.8' y2='140.5' stroke='#6c7386' stroke-width='1.6'/>
<rect x='214' y='92' width='168' height='104' rx='12' fill='#0f1117' stroke='#8fb3ff' stroke-opacity='0.55'/>
<text x='228' y='116' font-size='14' font-weight='700' fill='#eef0f6'>rate.html</text>
<text x='228' y='136' font-size='11.5' fill='#a7adbd'>blind: the songs shown,</text>
<text x='228' y='153' font-size='11.5' fill='#a7adbd'>never the version;</text>
<text x='228' y='170' font-size='11.5' fill='#a7adbd'>0-10 and a note each</text>
<line x1='382' y1='144' x2='398' y2='144' stroke='#6c7386' stroke-width='1.6'/>
<line x1='398' y1='144' x2='390.8' y2='147.5' stroke='#6c7386' stroke-width='1.6'/>
<line x1='398' y1='144' x2='390.8' y2='140.5' stroke='#6c7386' stroke-width='1.6'/>
<rect x='400' y='92' width='168' height='104' rx='12' fill='#0f1117' stroke='#8fb3ff' stroke-opacity='0.55'/>
<text x='414' y='116' font-size='14' font-weight='700' fill='#eef0f6'>the findings</text>
<text x='414' y='136' font-size='11.5' fill='#a7adbd'>each version against the</text>
<text x='414' y='153' font-size='11.5' fill='#a7adbd'>reference, kind by kind;</text>
<text x='414' y='170' font-size='11.5' fill='#a7adbd'>what to test next</text>
<line x1='568' y1='144' x2='584' y2='144' stroke='#6c7386' stroke-width='1.6'/>
<line x1='584' y1='144' x2='576.8' y2='147.5' stroke='#6c7386' stroke-width='1.6'/>
<line x1='584' y1='144' x2='576.8' y2='140.5' stroke='#6c7386' stroke-width='1.6'/>
<rect x='586' y='92' width='168' height='104' rx='12' fill='#0f1117' stroke='#c3a2ff' stroke-opacity='0.55'/>
<text x='600' y='116' font-size='14' font-weight='700' fill='#eef0f6'>freeze</text>
<text x='600' y='136' font-size='11.5' fill='#a7adbd'>the numbers that won,</text>
<text x='600' y='153' font-size='11.5' fill='#a7adbd'>written into a new model</text>
<text x='600' y='170' font-size='11.5' fill='#a7adbd'>that never changes</text>
<path d='M 578 200 C 578 250, 112 250, 112 200' fill='none' stroke='#6c7386' stroke-width='1.4' stroke-dasharray='4 4'/>
<text x='345' y='262' font-size='12' fill='#6c7386' text-anchor='middle'>the next round starts from the round's best (V1.1.0: rounds 1-4 · V1.2.0: round 5)</text>
</svg>